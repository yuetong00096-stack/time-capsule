<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Seven objects and the memories I keep with them.">
  <title>Time Capsule · Things I Keep</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script defer src="objects.js"></script>
  <script defer src="sketch.js"></script>
</head>
<body>
  <main id="home">
    <div id="canvas-host" aria-hidden="true"></div>
    <nav id="objects" aria-label="Select an object to read its story"></nav>
  </main>

  <dialog id="detail" aria-labelledby="detail-title">
    <div class="detail-bar">
      <button id="back" type="button">← Back</button>
    </div>
    <article>
      <h2 id="detail-title"></h2>
      <p id="description"></p>
      <p id="story"></p>
      <p id="relationship"></p>
    </article>
  </dialog>

  <p id="notice" role="status" hidden></p>
  <noscript>Please enable JavaScript to explore the objects and read their stories.</noscript>
</body>
</html>
